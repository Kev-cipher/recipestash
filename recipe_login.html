<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href = "recipe_login.css" />
        <title>Login</title>
    </head>
    <body>
        <!--Container covering the entire page-->
        <div class="page">
            <!-- animation container to hold the animation side of the login/ sign up page-->
            <div id = 'animation'>
    
            </div>
            <!--input container for login-->
            <div id="input">
                <div class="container">
                    <h1> Login </h1>
                    <hr>
                    <div id="login_input">
                        <label for="email"><b>Email</b></label>
                        <div>
                            <input type="email" placeholder="Email" email="Email" required>
                        </div>
                        <label for="password"><b>Password:</b></label>
                        <div>
                            <input type="password" placeholder="Password" name="password" required>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
