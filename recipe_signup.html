<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href = "recipe_login.css" />
        <title>RecipeStash</title>
    </head>
    <body>
        <!--Container covering the entire page-->
        <div class="page">
            <!-- animation container to hold the animation side of the login/ sign up page-->
            <div id = 'animation'>
    
            </div>
            <!--input container for login-->
            <div id="input">
                <div class="container">
                    <h1> Sign up </h1>
                    <!--Sign up info-->
                    <form action="register.php" method="POST">
                        <div id="login_input">
                            <div>
                                <label id='labelemail' for="email"><b>Email:</b></label>
                            </div>
                            <div>
                                <input id='email' type="email" placeholder="Email" name="email" required>
                            </div>
                            <hr>
                            <div id='labelp'>
                                <label for="password"><b>Password:</b></label>
                            </div>
                            <div>
                                <input id='password' type="password" placeholder="Password" name="password" required>
                            </div>
                            <hr>
                            <!--Sign up button-->
                            <div>
                                <button type="submit" class="registerbutton" ><b>Register</b></button>
                            </div>
                            <!--Take you back to login page-->
                            <div>
                                <button type="button" class="loginbutton" onclick="window.location.href='recipe_login.html'"><b>Login</b></button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
